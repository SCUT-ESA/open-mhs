[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openmhs"
version = "0.1.0"
description = "Open Model Hardware Standard (MHS) - An open-source implementation of AI agent hardware control"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Open MHS Contributors"},
]
keywords = ["mhs", "hardware", "ai-agent", "mcp", "robotics", "iot", "automation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "pydantic>=2.0",
    "typing-extensions>=4.0",
    "anyio>=3.0",
    "httpx>=0.24",
    "rich>=13.0",
    "pyyaml>=6.0",
    "jsonschema>=4.0",
]

[project.optional-dependencies]
mcp = ["mcp>=2.1,<2.2"]
api = ["fastapi>=0.100", "uvicorn>=0.23"]
# pi = ["gpiozero", "picamera2; platform_machine=='aarch64' or platform_machine=='armv7l'"]
arduino = ["pyserial>=3.5"]
camera = ["opencv-python>=4.8", "Pillow>=10.0"]
sensors = ["smbus2>=0.4"]
oscilloscope = ["pyvisa>=1.14"]

dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "black>=23.0",
    "ruff>=0.1",
    "mypy>=1.0",
    "mkdocs>=1.5",
    "mkdocs-material>=9.0",
]

[project.scripts]
openmhs = "openmhs.cli.main:main_sync"
mhs = "openmhs.cli.main:main_sync"

[project.urls]
Homepage = "https://github.com/SCUT-ESA/open-mhs"
Documentation = "https://github.com/SCUT-ESA/open-mhs#readme"
Repository = "https://github.com/SCUT-ESA/open-mhs"
Issues = "https://github.com/SCUT-ESA/open-mhs/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/openmhs"]

[tool.black]
line-length = 100
target-version = ['py39']

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.9"
strict = true
